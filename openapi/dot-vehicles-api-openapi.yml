      parameters:
      - allowEmptyValue: false
        collectionFormat: csv
        description: The location of Manufacturers to request. (ncap or all), defaults to ncap
        format: ''
        in: query
        name: data
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: The maximum number of records to return. Use '-1' to get all records.
        format: int32
        in: query
