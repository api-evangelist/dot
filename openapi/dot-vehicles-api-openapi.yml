        in: query
        name: modelYear
        required: true
        type: integer
      - allowEmptyValue: false
        collectionFormat: csv
        description: The vehicle's make
        format: ''
        in: query
        name: make
        required: true
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: The vehicle's model
        format: ''
        in: query
