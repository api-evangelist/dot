swagger: '2.0'
info:
  title: NHTSA childSeats vehicles API
  version: 1.6.0
  description: Child Seat search and list endpoints
tags:
- description: Vehicle search and list endpoints
  name: vehicles
paths:
  /vehicles:
    get:
      consumes:
      - application/json
      parameters:
      - allowEmptyValue: false
        collectionFormat: csv
        description: A comma separated list of data to return (crashtestratings, safetyfeatures, recommendedfeatures, complaints, recalls, investigations, manufacturercommunications, none, all), defaults to 'crashtestratings'.
        format: ''
        in: query
        name: data
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'Valid inputs: [minimal], [all] without brackets. Choose which detail level to show. defaults to: [all]'
        format: ''
        in: query
        name: productDetail
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: The maximum number of records to return
        format: int32
        in: query
        name: max
        required: false
        type: integer
      - allowEmptyValue: false
        collectionFormat: csv
        description: The offset of the records listing (for pagination).
        format: int32
        in: query
        name: offset
        required: false
        type: integer
      produces:
      - application/json
      responses:
        '200':
          description: Paginated list of all vehicles.
          schema:
            items:
              $ref: '#/definitions/VehicleBasicWrapped'
            title: ArrayOfVehicles
            type: array
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - vehicles
  /vehicles/byArtemisId:
    get:
      consumes:
      - application/json
      parameters:
      - allowEmptyValue: false
        collectionFormat: csv
        description: The artemisId for a vehicle.
        format: int64
        in: query
        name: artemisId
        required: true
        type: integer
      - allowEmptyValue: false
        collectionFormat: csv
        description: A comma separated list of data to return (crashtestratings, safetyfeatures, recommendedfeatures, complaints, recalls, investigations, manufacturercommunications, none, all), defaults to 'all'.
        format: ''
        in: query
        name: data
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'Valid inputs: [minimal], [all] without brackets. Choose which detail level to show. defaults to: [all]'
        format: ''
        in: query
        name: productDetail
        required: false
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: Return the vehicle associated with the specified artemisId.
          schema:
            $ref: '#/definitions/VehicleDetailsWrapped'
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - vehicles
  /vehicles/byMultipleArtemisIds:
    get:
      consumes:
      - application/json
      parameters:
      - allowEmptyValue: false
        collectionFormat: csv
        description: The artemisIds for vehicles. Comma separated if more than one
        format: int64
        in: query
        name: artemisIds
        required: true
        type: integer
      - allowEmptyValue: false
        collectionFormat: csv
        description: This should always be none, as we only want to return minimum counts data
        format: ''
        in: query
        name: data
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: This should always be null, as we want to get the counts
        format: ''
        in: query
        name: productDetail
        required: false
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: Return the vehicle associated with the specified artemisId.
          schema:
            $ref: '#/definitions/VehicleBasicWrapped'
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - vehicles
  /vehicles/byClass:
    get:
      consumes:
      - application/json
      parameters:
      - allowEmptyValue: false
        collectionFormat: csv
        description: The name of the class to search by.
        format: ''
        in: query
        name: vehicleClass
        required: true
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: A comma separated list of data to return (crashtestratings, safetyfeatures, recommendedfeatures, complaints, recalls, investigations, manufacturercommunications, none, all), defaults to 'none'.
        format: ''
        in: query
        name: data
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'Valid inputs: [minimal], [all] without brackets. Choose which detail level to show. defaults to: [minimal]'
        format: ''
        in: query
        name: productDetail
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: The maximum number of records to return.
        format: int32
        in: query
        name: max
        required: false
        type: integer
      - allowEmptyValue: false
        collectionFormat: csv
        description: The offset of the records listing (for pagination).
        format: int32
        in: query
        name: offset
        required: false
        type: integer
      produces:
      - application/json
      responses:
        '200':
          description: One or more vehicles that match the specified class.
          schema:
            $ref: '#/definitions/VehicleBasicWrapped'
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - vehicles
  /vehicles/byIds:
    get:
      consumes:
      - application/json
      parameters:
      - allowEmptyValue: false
        collectionFormat: csv
        description: A CSV list of IDs
        format: ''
        in: query
        name: ids
        required: true
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: A comma separated list of data to return (crashtestratings, safetyfeatures, recommendedfeatures, complaints, recalls, investigations, manufacturercommunications, none, all), defaults to 'crashtestratings'.
        format: ''
        in: query
        name: data
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'Valid inputs: [minimal], [all] without brackets. Choose which detail level to show. defaults to: [all]'
        format: ''
        in: query
        name: productDetail
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: The maximum number of records to return
        format: int32
        in: query
        name: max
        required: false
        type: integer
      - allowEmptyValue: false
        collectionFormat: csv
        description: The offset of the records listing (for pagination).
        format: int32
        in: query
        name: offset
        required: false
        type: integer
      produces:
      - application/json
      responses:
        '200':
          description: Paginated list of vehicles matching the specified list of CSV ids.
          schema:
            items:
              $ref: '#/definitions/VehicleDetailsWrapped'
            title: ArrayOfVehicles
            type: array
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - vehicles
  /vehicles/byManufacturer:
    get:
      consumes:
      - application/json
      parameters:
      - allowEmptyValue: false
        collectionFormat: csv
        description: The name of the manufacturer to search by.
        format: ''
        in: query
        name: manufacturerName
        required: true
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: The maximum number of records to return
        format: int32
        in: query
        name: max
        required: false
        type: integer
      - allowEmptyValue: false
        collectionFormat: csv
        description: The offset of the records listing (for pagination).
        format: int32
        in: query
        name: offset
        required: false
        type: integer
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'The model year to restrict the manufacturer search to. Format: yyyy-MM-dd'
        format: ''
        in: query
        name: dateStart
        required: false
        type: integer
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'The model year to restrict the manufacturer search to. Format: yyyy-MM-dd'
        format: ''
        in: query
        name: dateEnd
        required: false
        type: integer
      - allowEmptyValue: false
        collectionFormat: csv
        description: A comma separated list of data to return (crashtestratings, safetyfeatures, recommendedfeatures, complaints, recalls, investigations, manufacturercommunications, none, all), defaults to 'none'.
        format: ''
        in: query
        name: data
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'Valid inputs: [minimal], [all] without brackets. Choose which detail level to show. defaults to: [all]'
        format: ''
        in: query
        name: productDetail
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'The column to sort records by. Valid inputs: [''overallRating'', ''overallFrontCrashRating'', ''overallSideCrashRating'', ''rolloverRating'', ''recallsCount'', ''investigationsCount'', ''complaintsCount'', ''manufacturerCommunicationsCount'']'
        format: ''
        in: query
        name: sort
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'Which direction the ''sort'' parameter is applied, valid inputs: [asc, desc]'
        format: ''
        in: query
        name: order
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'Filter the response by the specified field. Valid inputs: [vehicleClass]'
        format: ''
        in: query
        name: filter
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'The value to use as a filter. Valid inputs: [SUV, TRUCK, PASSENGERCAR, VAN, BUS]'
        format: ''
        in: query
        name: filterValue
        required: false
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: One or more vehicles that match the specified manufacturer.
          schema:
            $ref: '#/definitions/VehicleBasicWrapped'
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - vehicles
  /vehicles/byNcapId:
    get:
      consumes:
      - application/json
      parameters:
      - allowEmptyValue: false
        collectionFormat: csv
        description: The NcapId of the vehicle to look up.
        format: ''
        in: query
        name: ncapId
        required: true
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: A comma separated list of data to return (crashtestratings, safetyfeatures, recommendedfeatures, complaints, recalls, investigations, manufacturercommunications, none, all), defaults to 'all'.
        format: ''
        in: query
        name: data
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'Valid inputs: [minimal], [all] without brackets. Choose which detail level to show. defaults to: [all]'
        format: ''
        in: query
        name: productDetail
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: The maximum number of records to return
        format: int32
        in: query
        name: max
        required: false
        type: integer
      - allowEmptyValue: false
        collectionFormat: csv
        description: The offset of the records set to return for pagination.
        format: int32
        in: query
        name: offset
        required: false
        type: integer
      produces:
      - application/json
      responses:
        '200':
          description: Paginated list of vehicles matching the specified NcapId (the original vehicle id in the source NCAP system).
          schema:
            items:
              $ref: '#/definitions/VehicleDetailsWrapped'
            title: ArrayOfVehicles
            type: array
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - vehicles
  /vehicles/bySearch:
    get:
      consumes:
      - application/json
      parameters:
      - allowEmptyValue: false
        collectionFormat: csv
        description: A fuzzy search query to search with
        format: ''
        in: query
        name: query
        required: true
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: match must have all keywords. true or false. defaults to true
        format: ''
        in: query
        name: allKeywords
        required: false
        type: boolean
      - allowEmptyValue: false
        collectionFormat: csv
        description: A comma separated list of data to return (crashtestratings, safetyfeatures, recommendedfeatures, complaints, recalls, investigations, manufacturercommunications, none, all), defaults to 'crashtestratings'.
        format: ''
        in: query
        name: data
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'Valid inputs: [minimal], [all] without brackets. Choose which detail level to show. defaults to: [all]'
        format: ''
        in: query
        name: productDetail
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'Find vehicles manufactured since this date (inclusive). Format: yyyy-MM-dd'
        format: date
        in: query
        name: dateStart
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'Find vehicles manufactured up to this date (inclusive). Format: yyyy-MM-dd'
        format: date
        in: query
        name: dateEnd
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'The column to sort records by. Valid inputs: [''overallRating'', ''overallFrontCrashRating'', ''overallSideCrashRating'', ''rolloverRating'', ''recallsCount'', ''investigationsCount'', ''complaintsCount'', ''manufacturerCommunicationsCount'']'
        format: ''
        in: query
        name: sort
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'Which direction the ''sort'' parameter is applied, valid inputs: [asc, desc]'
        format: ''
        in: query
        name: order
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'Filter the response by the specified field. Valid inputs: [vehicleClass]'
        format: ''
        in: query
        name: filter
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'The value to use as a filter. Valid inputs: [SUV, TRUCK, PASSENGERCAR, VAN, BUS]'
        format: ''
        in: query
        name: filterValue
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'The maximum number of records to return, upper bound: 50.'
        format: int32
        in: query
        name: max
        required: false
        type: integer
      - allowEmptyValue: false
        collectionFormat: csv
        description: The offset of the records listing (for pagination).
        format: int32
        in: query
        name: offset
        required: false
        type: integer
      produces:
      - application/json
      responses:
        '200':
          description: Paginated list of vehicles whose make, model, year, or trim match the supplied search query.
          schema:
            $ref: '#/definitions/VehicleBasicWrapped'
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - vehicles
  /vehicles/byVin:
    get:
      consumes:
      - application/json
      parameters:
      - allowEmptyValue: false
        collectionFormat: csv
        description: The vin number to search for vehicles with.
        format: ''
        in: query
        name: vin
        required: true
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: A comma separated list of data to return (crashtestratings, safetyfeatures, recommendedfeatures, complaints, recalls, investigations, manufacturercommunications, none, all), defaults to 'all'.
        format: ''
        in: query
        name: data
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'Valid inputs: [minimal], [all] without brackets. Choose which detail level to show. defaults to: [all]'
        format: ''
        in: query
        name: productDetail
        required: false
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: One or more vehicles that match the user-provided VIN.
          schema:
            $ref: '#/definitions/VehicleDetailsWrapped'
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - vehicles
  /vehicles/byYmmt:
    get:
      consumes:
      - application/json
      parameters:
      - allowEmptyValue: false
        collectionFormat: csv
        description: The vehicles modelYear
        format: int32
        in: query
        name: modelYear
        required: true
        type: integer
      - allowEmptyValue: false
        collectionFormat: csv
        description: The vehicles make
        format: ''
        in: query
        name: make
        required: true
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: The vehicle model
        format: ''
        in: query
        name: model
        required: true
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: The vehicle trim
        format: ''
        in: query
        name: trim
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: The vehicle series
        format: ''
        in: query
        name: series
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: A comma separated list of data to return (crashtestratings, safetyfeatures, recommendedfeatures, complaints, recalls, investigations, manufacturercommunications, none, all), defaults to 'all'.
        format: ''
        in: query
        name: data
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: 'Valid inputs: [minimal], [all] without brackets. Choose which detail level to show. defaults to: [all]'
        format: ''
        in: query
        name: productDetail
        required: false
        type: string
      - allowEmptyValue: false
        collectionFormat: csv
        description: The maximum number of records to return
        format: int32
        in: query
        name: max
        required: false
        type: integer
      - allowEmptyValue: false
        collectionFormat: csv
        description: The offset of the records listing (for pagination).
        format: int32
        in: query
        name: offset
        required: false
        type: integer
      produces:
      - application/json
      responses:
        '200':
          description: Paginated list of vehicles matching the specified modelYear, make, model, and [trim (optional)].
          schema:
            $ref: '#/definitions/VehicleDetailsWrapped'
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - vehicles
  /vehicles/classes:
    get:
      consumes:
      - application/json
      parameters:
      - allowEmptyValue: false
        collectionFormat: csv
        description: The maximum number of records to return. Use '-1' to get all records.
        format: int32
        in: query
        name: max
        required: false
        type: integer
      - allowEmptyValue: false
        collectionFormat: csv
        description: The offset of the records listing (for pagination).
        format: int32
        in: query
        name: offset
        required: false
        type: integer
      produces:
      - application/json
      responses:
        '200':
          description: List of all vehicle classes.
          schema:
            $ref: '#/definitions/PartialVehicleWrapped'
        '500':
          description: Internal Server Error
      tags:
